name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: run tests
        run: make test
  checkstyle-job:
    needs:
      - tests-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: run lint
        run: make lint
